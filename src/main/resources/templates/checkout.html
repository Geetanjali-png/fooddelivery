<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Checkout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .checkout-box {
            width: 500px;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-top: 8px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<h1>Checkout</h1>

<div class="checkout-box">

    <h2>Delivery Details</h2>

    <p>
        Customer:
        <strong th:text="${user.fullName}"></strong>
    </p>

    <p>
        Email:
        <span th:text="${user.email}"></span>
    </p>

    <form th:action="@{/checkout/place-order}" method="post">

        <input type="hidden"
               name="userId"
               th:value="${user.id}">

        <label for="deliveryAddress">
            Delivery Address
        </label>

        <br>

        <textarea id="deliveryAddress"
                  name="deliveryAddress"
                  th:text="${user.address}"
                  required></textarea>

        <br><br>

        <button type="submit">
            Place Order
        </button>

    </form>

    <br>

    <a th:href="@{/cart(userId=${user.id})}">
        ← Back to Cart
    </a>

</div>

</body>

</html>
