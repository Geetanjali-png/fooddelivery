<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Menu</title>
</head>

<body>

<h1 th:text="${restaurant.name} + ' - Menu'"></h1>

<p th:text="${restaurant.description}"></p>

<br>

<!-- Search Menu -->
<form th:action="@{/menu/list}" method="get">

    <input type="hidden"
           name="restaurantId"
           th:value="${restaurant.id}">

    <input type="text"
           name="search"
           placeholder="Search food item"
           th:value="${search}">

    <button type="submit">Search</button>

</form>

<br>

<!-- Category Filter -->
<form th:action="@{/menu/list}" method="get">

    <input type="hidden"
           name="restaurantId"
           th:value="${restaurant.id}">

    <select name="category">

        <option value="">All Categories</option>

        <option value="Biryani">Biryani</option>

        <option value="Pizza">Pizza</option>

        <option value="Burger">Burger</option>

        <option value="Dosa">Dosa</option>

        <option value="Chinese">Chinese</option>

        <option value="Drinks">Drinks</option>

        <option value="Desserts">Desserts</option>

    </select>

    <button type="submit">Filter</button>

</form>

<br>

<a th:href="@{/menu/list(restaurantId=${restaurant.id})}">
    Show All Menu Items
</a>

<br><br>

<a th:href="@{/menu/add(restaurantId=${restaurant.id})}">
    Add Menu Item
</a>

<br><br>

<table border="1">

    <thead>

    <tr>

        <th>ID</th>

        <th>Name</th>

        <th>Description</th>

        <th>Price</th>

        <th>Category</th>

        <th>Available</th>

        <th>Action</th>

    </tr>

    </thead>

    <tbody>

    <tr th:each="item : ${menuItems}">

        <td th:text="${item.id}"></td>

        <td th:text="${item.name}"></td>

        <td th:text="${item.description}"></td>

        <td th:text="${item.price}"></td>

        <td th:text="${item.category}"></td>

        <td th:text="${item.available}"></td>

        <td>

            <form th:action="@{/cart/add}" method="post">

                <input type="hidden"
                       name="userId"
                       value="1">

                <input type="hidden"
                       name="menuItemId"
                       th:value="${item.id}">

                <input type="number"
                       name="quantity"
                       value="1"
                       min="1">

                <button type="submit">
                    Add to Cart
                </button>

            </form>

            <br>

            <a th:href="@{/menu/delete/{id}(id=${item.id}, restaurantId=${restaurant.id})}">
                Delete
            </a>

        </td>

    </tr>

    </tbody>

</table>

<br>

<a th:href="@{/restaurant/list}">
    Back to Restaurants
</a>

</body>

</html>
